<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academy Batch Controller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="dot"></span>
      <h1>Academy Batch Controller</h1>
    </div>

    <p class="label">Current Shift</p>

    <div id="shift" class="shift" aria-live="polite">—</div>

    <div class="divider"></div>

    <div class="clock-wrap">
      <span class="clock-label">IST</span>
      <div id="clock" class="clock">—</div>
      <div id="date" class="date">—</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
